<!DOCTYPE html>
<html>
    <head>
        <title>Shooter Game - Nurlana</title>
    </head>
    <body>
        <!-- Phaser dimuat PERTAMA -->
        <script src="phaser.min.js"></script>

        <!-- Variabel global dimuat KEDUA -->
        <script>
            var layoutSize = { 'w': 768, 'h': 1024 };
            var X_POSITION;
            var Y_POSITION;
            var currentHero = 0;
            var countHero = 2;
        </script>

        <!-- Scene JS dimuat KETIGA (setelah Phaser ready) -->
        <script src="sceneMenu.js"></script>
        <script src="scenePilihHero.js"></script>
        <script src="scenePlay.js"></script>
        <script src="sceneGameOver.js"></script>

        <!-- Game config dimuat TERAKHIR -->
        <script>
            const config = {
                type: Phaser.AUTO,
                width: 768,
                height: 1024,
                scene: [sceneMenu, scenePilihHero, scenePlay, sceneGameOver],
                scale: {
                    autoCenter: Phaser.Scale.CENTER_BOTH,
                }
            };
            const game = new Phaser.Game(config);
        </script>
    </body>
</html>
