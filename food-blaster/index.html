<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Blaster!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#111213;--bg2:#1a1c1e;--bg3:#222527;--panel:#1e2022;
    --border:#333639;--border2:#444749;
    --g1:#8a8f95;--g2:#c0c5cc;--white:#eef0f2;
    --yellow:#e8c848;--red:#e05252;--green:#5ec97a;--orange:#f0922b;--cyan:#4dd9e8;
    --font-hd:'Bebas Neue',sans-serif;--font-mono:'Share Tech Mono',monospace;
  }
  html,body{width:100%;height:100%;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #gw{position:relative;width:400px;background:var(--bg2);border:1px solid var(--border);box-shadow:0 0 0 1px #0006,inset 0 1px 0 #ffffff08;}
  #hud{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--panel);border-bottom:1px solid var(--border);padding:8px 14px;}
  .hud-cell{display:flex;flex-direction:column;align-items:center;}
  .hud-cell:first-child{align-items:flex-start;}.hud-cell:last-child{align-items:flex-end;}
  .hud-lbl{font-family:var(--font-mono);font-size:9px;color:var(--g1);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
  .hud-val{font-family:var(--font-hd);font-size:22px;color:var(--white);letter-spacing:1px;line-height:1;}
  #gc{display:block;}
  #bar{background:var(--panel);border-top:1px solid var(--border);padding:5px 14px;font-family:var(--font-mono);font-size:10px;color:var(--g1);text-align:center;letter-spacing:1px;}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,11,12,0.9);z-index:10;}
  #overlay.hidden{display:none;}
  .modal{width:300px;background:var(--panel);border:1px solid var(--border2);padding:36px 32px 32px;display:flex;flex-direction:column;align-items:center;gap:18px;position:relative;}
  .modal::before,.modal::after{content:'';position:absolute;width:12px;height:12px;border-color:var(--g1);border-style:solid;}
  .modal::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}.modal::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
  .modal-icon{font-size:48px;line-height:1;}
  .modal-title{font-family:var(--font-hd);font-size:42px;color:var(--white);letter-spacing:4px;text-align:center;line-height:1;}
  .modal-sub{font-family:var(--font-mono);font-size:11px;color:var(--g1);text-align:center;letter-spacing:1px;line-height:1.7;}
  .modal-score{font-family:var(--font-mono);font-size:13px;color:var(--yellow);letter-spacing:2px;}
  .ctrl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;}
  .ctrl-item{background:var(--bg3);border:1px solid var(--border);padding:8px 10px;display:flex;align-items:center;gap:8px;}
  .ctrl-key{font-family:var(--font-mono);font-size:11px;color:var(--white);background:var(--bg);border:1px solid var(--border2);padding:2px 6px;white-space:nowrap;}
  .ctrl-desc{font-family:var(--font-mono);font-size:10px;color:var(--g1);}
  .btn-start{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--white);font-family:var(--font-hd);font-size:22px;letter-spacing:4px;padding:14px;cursor:pointer;position:relative;transition:background .15s;outline:none;}
  .btn-start::before,.btn-start::after{content:'';position:absolute;width:8px;height:8px;border-color:var(--g2);border-style:solid;}
  .btn-start::before{top:-1px;left:-1px;border-width:2px 0 0 2px;}.btn-start::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}
  .btn-start:hover{background:var(--border);}

  /* ── GAME OVER SPECIFIC ── */
  .go-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:0;}
  .go-title{
    font-family:var(--font-hd);font-size:64px;color:var(--white);
    letter-spacing:6px;text-align:center;line-height:.95;
    text-shadow:0 0 40px rgba(224,82,82,.35);
  }
  .go-divider{width:100%;height:1px;background:var(--border2);margin:18px 0;}
  .go-score-block{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .go-score-lbl{font-family:var(--font-mono);font-size:9px;color:var(--g1);letter-spacing:3px;text-transform:uppercase;}
  .go-score-num{
    font-family:var(--font-hd);font-size:56px;color:var(--yellow);
    letter-spacing:4px;line-height:1;
    text-shadow:0 0 24px rgba(232,200,72,.4);
  }
  .go-stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
  .go-stat{background:var(--bg3);border:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .go-stat-lbl{font-family:var(--font-mono);font-size:8px;color:var(--g1);letter-spacing:2px;text-transform:uppercase;}
  .go-stat-val{font-family:var(--font-hd);font-size:28px;color:var(--white);letter-spacing:2px;line-height:1;}
  @keyframes goBlink{0%,100%{opacity:1}50%{opacity:.4}}
  .go-tag{
    font-family:var(--font-mono);font-size:10px;color:var(--red);
    letter-spacing:3px;text-transform:uppercase;
    animation:goBlink 1.2s ease-in-out infinite;
  }

  #scanlines{position:absolute;top:42px;left:0;right:0;bottom:34px;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);pointer-events:none;z-index:5;}
</style>
</head>
<body>
<div id="gw">
  <div id="hud">
    <div class="hud-cell"><span class="hud-lbl">score</span><span class="hud-val" id="scoreEl">00000</span></div>
    <div class="hud-cell"><span class="hud-lbl">level</span><span class="hud-val" id="levelEl">1</span></div>
    <div class="hud-cell"><span class="hud-lbl">lives</span><span class="hud-val" id="livesEl">♥♥♥</span></div>
  </div>
  <canvas id="gc" width="400" height="540"></canvas>
  <div id="scanlines"></div>
  <div id="bar">← → GERAK &nbsp;|&nbsp; TAHAN SPACE TEMBAK &nbsp;|&nbsp; MOBILE: DRAG</div>
  <div id="overlay"><div class="modal" id="modalBox"></div></div>
</div>
<script>
const C=document.getElementById('gc'),ctx=C.getContext('2d');
const W=C.width,H=C.height;
const overlay=document.getElementById('overlay');
const modalBox=document.getElementById('modalBox');
const scoreEl=document.getElementById('scoreEl');
const levelEl=document.getElementById('levelEl');
const livesEl=document.getElementById('livesEl');

// Palette
const Y='#e8c848',R='#e05252',G='#5ec97a',O='#f0922b',CY='#4dd9e8';

// ── EMOJI → offscreen canvas ──────────────────────────────
function mkImg(em,sz){
  const cv=document.createElement('canvas');
  cv.width=cv.height=sz;
  const x=cv.getContext('2d');
  x.font=Math.round(sz*.82)+'px serif';
  x.textAlign='center';x.textBaseline='middle';
  x.fillText(em,sz/2,sz/2);
  return cv;
}
const FOOD_EM=['🍕','🍔','🍩','🌮','🍣','🍦','🧁','🍟','🥗','🌯'];
const BAD_EM=['☠️','💀','🤢'];
const FIMGS=FOOD_EM.map(e=>mkImg(e,36));
const BIMGS=BAD_EM.map(e=>mkImg(e,36));
const CHEF=mkImg('👨‍🍳',42);

// ── STATE ─────────────────────────────────────────────────
let running=false,gameOver=false;
let score,level,lives;
let player,bullets,foods;
let particles=[],hitTexts=[],flashes=[];
let combo=0,comboT=0;
let shakeAmt=0,shakeX=0,shakeY=0;
let keys={},holdSpace=false,touchX=null;
let spawnTimer=0,shotTimer=0,frameN=0;

const STARS=Array.from({length:70},()=>({
  x:Math.random()*W, y:Math.random()*H,
  r:Math.random()*1.3+.2, a:Math.random()*.45+.08,
  s:Math.random()*.14+.03
}));

// ── INIT ──────────────────────────────────────────────────
function init(){
  score=0;level=1;lives=3;
  combo=0;comboT=0;shakeAmt=0;
  particles=[];hitTexts=[];flashes=[];
  bullets=[];foods=[];
  spawnTimer=0;shotTimer=0;frameN=0;
  player={x:W/2-20,y:H-72,w:40,h:48,spd:5,recoil:0};
  updHUD();
}
function updHUD(){
  scoreEl.textContent=String(score).padStart(5,'0');
  levelEl.textContent=level;
  livesEl.textContent='♥'.repeat(Math.max(0,lives));
  livesEl.style.color=lives<=1?R:'#c0c5cc';
}

// ── SHOOT ─────────────────────────────────────────────────
function shoot(){
  const bx=player.x+player.w/2;
  const by=player.y+10+player.recoil;
  // main bullet straight up
  bullets.push({x:bx,y:by,vx:0,vy:-14,r:4.5,trail:[]});
  // every ~20 frames: spread shot
  if(frameN%20===0){
    bullets.push({x:bx,y:by,vx:-2.2,vy:-12,r:3,trail:[]});
    bullets.push({x:bx,y:by,vx:2.2,vy:-12,r:3,trail:[]});
  }
  player.recoil=Math.min(player.recoil+6,12);
  shakeAmt=Math.max(shakeAmt,3);
  flashes.push({x:bx,y:by-4,t:5});
}

// ── SPAWN FOOD ────────────────────────────────────────────
function spawnFood(){
  const bad=Math.random()<.18+level*.015;
  const x=22+Math.random()*(W-44);
  const spd=1.2+level*.28+Math.random()*.7;
  foods.push({
    x,y:-20,
    img: bad ? BIMGS[Math.floor(Math.random()*BIMGS.length)]
             : FIMGS[Math.floor(Math.random()*FIMGS.length)],
    vy:spd, bad,
    dead:false,
    wob:Math.random()*Math.PI*2,
    flash:0
  });
}

// ── EFFECTS ──────────────────────────────────────────────
function burst(x,y,col,n){
  for(let i=0;i<n;i++)
    particles.push({x,y,
      vx:(Math.random()-.5)*8,vy:(Math.random()-2.8)*5,
      r:Math.random()*3+.8,c:col,life:40+Math.random()*25,
      spark:Math.random()<.4});
}
function popText(x,y,txt,col){
  hitTexts.push({x,y,txt,col,life:55,vy:-1.6});
}

// ── DRAW ─────────────────────────────────────────────────
function drawBg(){
  ctx.fillStyle='#111213';ctx.fillRect(0,0,W,H);
  // grid
  ctx.save();ctx.strokeStyle='rgba(255,255,255,0.022)';ctx.lineWidth=.5;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.restore();
  // stars
  STARS.forEach(s=>{
    s.y+=s.s; if(s.y>H)s.y=0;
    ctx.globalAlpha=s.a;ctx.fillStyle='#eef0f2';
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawFloor(){
  ctx.fillStyle='#2a2d30';ctx.fillRect(0,H-22,W,22);
  ctx.fillStyle='#3a3e42';ctx.fillRect(0,H-22,W,3);
  ctx.fillStyle='#555';
  for(let i=10;i<W-10;i+=24){ctx.beginPath();ctx.arc(i,H-10,2,0,Math.PI*2);ctx.fill();}
}
function drawPlayer(){
  const p=player;
  if(p.recoil>0) p.recoil=Math.max(0,p.recoil-.9);
  // platform
  ctx.save();ctx.shadowColor='rgba(180,190,200,.2)';ctx.shadowBlur=14;
  ctx.fillStyle='rgba(50,55,60,.55)';ctx.fillRect(p.x-2,p.y+36,p.w+4,16);
  ctx.restore();
  // chef
  ctx.drawImage(CHEF,p.x,p.y-2+p.recoil*.35,p.w,p.h);
  // gun
  ctx.fillStyle='#444';ctx.fillRect(p.x+p.w/2-3,p.y+26+p.recoil,6,18);
  ctx.fillStyle='#666';ctx.fillRect(p.x+p.w/2-2,p.y+24+p.recoil,4,6);
}
function drawFlashes(){
  flashes.forEach(f=>{
    const prog=f.t/5;
    ctx.save();ctx.globalAlpha=prog*.95;
    ctx.shadowColor=Y;ctx.shadowBlur=18;ctx.fillStyle=Y;
    for(let a=0;a<4;a++){
      ctx.save();ctx.translate(f.x,f.y);ctx.rotate(a*Math.PI/2);
      ctx.beginPath();ctx.moveTo(0,-13*prog);ctx.lineTo(2.5,0);ctx.lineTo(0,13*prog);ctx.lineTo(-2.5,0);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    f.t--;
  });
  flashes=flashes.filter(f=>f.t>0);
}
function drawBullets(){
  bullets.forEach(b=>{
    // trail
    b.trail.unshift({x:b.x,y:b.y});
    if(b.trail.length>9)b.trail.pop();
    b.trail.forEach((t,i)=>{
      ctx.globalAlpha=(1-i/b.trail.length)*.35;
      ctx.fillStyle=b.r<4?CY:Y;
      ctx.beginPath();ctx.arc(t.x,t.y,Math.max(.5,b.r-.4*i),0,Math.PI*2);ctx.fill();
    });
    ctx.globalAlpha=1;
    // head
    ctx.save();
    ctx.shadowColor=b.r<4?CY:Y;ctx.shadowBlur=10;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r+.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=b.r<4?CY:Y;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}
function drawFoods(){
  foods.forEach(f=>{
    if(f.dead)return;
    f.wob+=.04;
    if(f.flash>0)f.flash--;
    const wx=f.x+Math.sin(f.wob)*2;
    const sc=1+(f.flash*.05);
    // drop shadow
    ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(wx,f.y+19,15,4,0,0,Math.PI*2);ctx.fill();ctx.restore();
    // emoji
    ctx.save();ctx.translate(wx,f.y);ctx.scale(sc,sc);
    ctx.drawImage(f.img,-18,-18,36,36);
    if(f.bad){ctx.globalAlpha=.28;ctx.fillStyle=R;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();}
    ctx.restore();
  });
}
function drawParticles(){
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.13;p.life--;
    const a=Math.max(0,p.life/60);
    ctx.globalAlpha=a;
    if(p.spark){
      ctx.strokeStyle=p.c;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.5,p.y-p.vy*2.5);ctx.stroke();
    } else {
      ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    }
  });
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
}
function drawHitTexts(){
  hitTexts.forEach(h=>{
    h.y+=h.vy;h.life--;
    const a=Math.max(0,h.life/55);
    ctx.save();ctx.globalAlpha=a;
    const isLvl=h.txt.startsWith('LEVEL');
    ctx.font=(isLvl?'bold 32px':'bold 18px')+' Bebas Neue,sans-serif';
    ctx.fillStyle=h.col;ctx.textAlign='center';
    ctx.shadowColor=h.col;ctx.shadowBlur=isLvl?20:8;
    ctx.fillText(h.txt,h.x,h.y);ctx.restore();
  });
  hitTexts=hitTexts.filter(h=>h.life>0);
}
function drawCombo(){
  if(combo<2||comboT<=0)return;
  const a=Math.min(1,comboT/30);
  ctx.save();ctx.globalAlpha=a;
  ctx.font=`900 ${18+combo*2}px Bebas Neue,sans-serif`;
  ctx.fillStyle=combo>=5?O:Y;
  ctx.shadowColor=combo>=5?O:Y;ctx.shadowBlur=14;
  ctx.textAlign='right';
  ctx.fillText(combo+'x COMBO!',W-12,30);
  ctx.restore();
}

// ── UPDATE ────────────────────────────────────────────────
function update(){
  frameN++;
  if(shotTimer>0)shotTimer--;
  if(comboT>0){comboT--;if(comboT===0)combo=0;}
  // shake
  if(shakeAmt>0){
    shakeAmt=Math.max(0,shakeAmt-.35);
    shakeX=(Math.random()-.5)*shakeAmt;
    shakeY=(Math.random()-.5)*shakeAmt;
  } else {shakeX=0;shakeY=0;}

  // player move
  let dx=0;
  if(keys['ArrowLeft']||keys['a'])dx=-1;
  if(keys['ArrowRight']||keys['d'])dx=1;
  if(touchX!==null){const cx=player.x+player.w/2;if(Math.abs(touchX-cx)>8)dx=touchX-cx>0?1:-1;}
  player.x=Math.max(0,Math.min(W-player.w,player.x+dx*player.spd));

  // shoot trigger
  if((holdSpace||touchX!==null)&&shotTimer===0){shoot();shotTimer=8;}

  // spawn — lv1=80, lv2=62, lv3=44, lv4=32, lv5=24
  const rate=[80,62,44,32,24][Math.min(level-1,4)];
  spawnTimer++;
  if(spawnTimer>=rate){
    spawnTimer=0;
    spawnFood();
    if(level>=3) spawnFood();
    if(level>=4) spawnFood();
    if(level>=5) spawnFood();
  }
  if(level>=3 && spawnTimer===Math.floor(rate/2)) spawnFood();
  if(level>=5 && spawnTimer===Math.floor(rate*3/4)) spawnFood();

  // move bullets
  bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
  bullets=bullets.filter(b=>b.y>-10&&b.x>-10&&b.x<W+10);

  // move foods
  foods.forEach(f=>{if(!f.dead)f.y+=f.vy;});

  // ── COLLISION (simple, reliable) ──────────────────────
  for(let bi=bullets.length-1;bi>=0;bi--){
    const b=bullets[bi];
    let hit=false;
    for(let fi=0;fi<foods.length;fi++){
      const f=foods[fi];
      if(f.dead)continue;
      const dx=b.x-f.x, dy=b.y-f.y;
      if(dx*dx+dy*dy < 22*22){        // radius 22 — generous & reliable
        f.dead=true;
        hit=true;
        f.flash=8;
        if(f.bad){
          burst(f.x,f.y,R,16);
          shakeAmt=Math.max(shakeAmt,9);
          combo=0;comboT=0;
          lives=Math.max(0,lives-1);updHUD();
          if(lives===0){triggerGameOver();return;}
        } else {
          combo++;comboT=90;
          const pts=(10+combo*2)*level;
          burst(f.x,f.y,combo>=5?O:G,10);
          popText(f.x,f.y-14,'+'+pts,combo>=5?O:Y);
          shakeAmt=Math.max(shakeAmt,combo>=5?6:2);
          score+=pts;updHUD();
        }
        break;
      }
    }
    if(hit)bullets.splice(bi,1);
  }

  // foods hit floor
  for(let fi=foods.length-1;fi>=0;fi--){
    const f=foods[fi];
    if(!f.dead&&f.y>H-18){
      f.dead=true;
      if(!f.bad){
        burst(f.x,H-18,Y,8);
        shakeAmt=Math.max(shakeAmt,7);
        combo=0;
        lives=Math.max(0,lives-1);updHUD();
        if(lives===0){triggerGameOver();return;}
      }
    }
  }
  foods=foods.filter(f=>!f.dead);

  // level up — threshold tiap level, max level 5
  const thresholds=[0,80,200,380,600];
  if(level<5 && score>=thresholds[level]){
    level++;updHUD();
    // notif level up
    popText(W/2,H/2-40,'LEVEL '+level+'!',CY);
    burst(W/2,H/2,CY,18);
    shakeAmt=Math.max(shakeAmt,8);
  }
}

// ── LOOP ─────────────────────────────────────────────────
function loop(){
  if(!running)return;
  update();
  ctx.save();ctx.translate(shakeX,shakeY);
  drawBg();drawFloor();drawFoods();drawBullets();drawFlashes();drawPlayer();drawParticles();drawHitTexts();drawCombo();
  ctx.restore();
  requestAnimationFrame(loop);
}

// ── OVERLAYS ─────────────────────────────────────────────
function showMenu(){
  overlay.classList.remove('hidden');
  modalBox.innerHTML=`
    <div class="modal-icon">🍕</div>
    <div class="modal-title">FOOD<br>BLASTER</div>
    <div class="modal-sub">Tembak makanan sebelum jatuh ke lantai!<br>Hindari ☠️ · Combo = poin makin gede!</div>
    <button class="btn-start" id="startBtn">▶ MULAI</button>`;
  document.getElementById('startBtn').onclick=startGame;
}
function showGameOver(){
  overlay.classList.remove('hidden');
  const grade = score>=500?'S':score>=300?'A':score>=150?'B':score>=50?'C':'D';
  const gradeColor = grade==='S'?'#e8c848':grade==='A'?'#5ec97a':grade==='B'?'#5b9bd5':grade==='C'?'#c0c5cc':'#8a8f95';
  modalBox.innerHTML=`
    <div class="go-wrap">
      <div style="font-size:44px;margin-bottom:10px;line-height:1;">💥</div>
      <div class="go-title">GAME<br>OVER</div>
      <div class="go-tag" style="margin-top:8px;">— misi gagal —</div>
      <div class="go-divider"></div>
      <div class="go-score-block">
        <span class="go-score-lbl">total skor</span>
        <span class="go-score-num">${String(score).padStart(5,'0')}</span>
      </div>
      <div class="go-stats" style="margin-top:14px;">
        <div class="go-stat">
          <span class="go-stat-lbl">level</span>
          <span class="go-stat-val">${level}</span>
        </div>
        <div class="go-stat">
          <span class="go-stat-lbl">grade</span>
          <span class="go-stat-val" style="color:${gradeColor};text-shadow:0 0 16px ${gradeColor}88;">${grade}</span>
        </div>
      </div>
      <div class="go-divider" style="margin-top:18px;"></div>
      <button class="btn-start" id="startBtn" style="margin-top:2px;">▶ MAIN LAGI</button>
    </div>`;
  document.getElementById('startBtn').onclick=startGame;
}
function triggerGameOver(){
  running=false;gameOver=true;
  setTimeout(showGameOver,500);
}
function startGame(){
  overlay.classList.add('hidden');
  gameOver=false;running=true;
  init();loop();
}

// ── INPUT ─────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key===' '){e.preventDefault();holdSpace=true;}
});
document.addEventListener('keyup',e=>{
  keys[e.key]=false;
  if(e.key===' ')holdSpace=false;
});
C.addEventListener('touchstart',e=>{
  const r=C.getBoundingClientRect();
  touchX=(e.touches[0].clientX-r.left)*(W/r.width);
},{passive:true});
C.addEventListener('touchmove',e=>{
  const r=C.getBoundingClientRect();
  touchX=(e.touches[0].clientX-r.left)*(W/r.width);
},{passive:true});
C.addEventListener('touchend',()=>{touchX=null;},{passive:true});

// ── BOOT ─────────────────────────────────────────────────
showMenu();
(function idleBg(){
  if(!running){drawBg();drawFloor();}
  requestAnimationFrame(idleBg);
})();
</script>
</body>
</html>
